<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鲜花酿 · 酒馆</title>
  <style>
    :root { color-scheme: light; --bg: #f7f1e7; --ink: #40544d; --muted: #71857c; --mint: #5dae8e; --mint-deep: #39765e; --mint-soft: #e6f2eb; --pink: #e89bb0; --line: #d9e7df; }
    * { box-sizing: border-box; }
    html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "LXGW WenKai", "霞鹜文楷", "Microsoft YaHei", system-ui, sans-serif; }
    button { font: inherit; }
    #stage { position: relative; }
    #frame { display: none; width: 100%; height: 100%; border: 0; background: #fff; }
    #frame.visible { display: block; }
    #message { position: absolute; inset: 0; display: none; place-content: center; justify-items: center; gap: 13px; padding: 24px; text-align: center; color: var(--muted); }
    #message.visible { display: grid; }
    .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 15px; background: var(--mint-soft); color: var(--mint-deep); font-size: 19px; font-weight: 700; }
    #messageText { max-width: 460px; margin: 0; line-height: 1.75; overflow-wrap: anywhere; }
    #retry { min-height: 36px; padding: 8px 14px; border: 0; border-radius: 11px; background: var(--mint-deep); color: #fff; font-size: 13px; cursor: pointer; }
    #retry:hover { background: #2f654f; }
    #retry:focus-visible { outline: 3px solid rgba(232, 155, 176, .45); outline-offset: 2px; }
    #retry[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="stage">
    <iframe id="frame" title="SillyTavern" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    <section id="message" class="visible" aria-live="polite">
      <span class="mark" aria-hidden="true">花</span>
      <p id="messageText">正在打开酒馆…</p>
      <button id="retry" type="button" hidden>重新连接酒馆</button>
    </section>
  </main>
  <script type="module">
    import { hana } from "./assets/sdk.js";
    hana.ready();
    (() => {
      const api = hana?.api;
      const frame = document.getElementById("frame");
      const message = document.getElementById("message");
      const messageText = document.getElementById("messageText");
      const retry = document.getElementById("retry");
      let frameUrl = "";
      let frameTimeout = 0;

      function showMessage(text, canRetry = false) {
        window.clearTimeout(frameTimeout);
        frame.classList.remove("visible");
        messageText.textContent = text;
        retry.hidden = !canRetry;
        message.classList.add("visible");
      }
      async function call(path, init = {}) {
        if (!api?.fetch) throw new Error("当前页面没有拿到 Hana App 请求桥接。");
        const response = await api.fetch(path, init);
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) throw new Error(data.error || `请求失败（${response.status}）`);
        return data;
      }
      function showFrame(data) {
        const managedUrl = data.runtimeId && api?.url
          ? api.url(`_runtime/${encodeURIComponent(data.runtimeId)}/index.html?hanaLaunch=${Date.now()}`)
          : "";
        frameUrl = managedUrl || (data.serverUrl
          ? new URL("index.html?hanaLaunch=" + Date.now(), data.serverUrl).href
          : "");
        if (!frameUrl) throw new Error("酒馆已经启动，但没有拿到可加载的页面地址。");
        messageText.textContent = "酒馆正在载入…";
        retry.hidden = true;
        message.classList.add("visible");
        frame.classList.add("visible");
        frameTimeout = window.setTimeout(() => showMessage("酒馆页面载入超时，可重试连接。", true), 30000);
        frame.src = frameUrl;
      }
      async function launchTavern() {
        retry.disabled = true;
        showMessage("正在准备酒馆。首次启动会安装所需文件，可能需要几分钟，请保持网络连接…");
        try {
          let data = await call("runtime/start", { method: "POST" });
          const deadline = Date.now() + 10 * 60 * 1000;
          while (!data.ready && data.running && Date.now() < deadline) {
            await new Promise((resolve) => setTimeout(resolve, 1000));
            data = await call("runtime/status");
          }
          if (!data.ready) throw new Error("酒馆服务在等待时间内没有就绪，可稍后重试。");
          showFrame(data);
        } catch (error) {
          showMessage(`酒馆没有打开：${error.message}`, true);
        } finally {
          retry.disabled = false;
        }
      }

      retry.addEventListener("click", launchTavern);
      frame.addEventListener("load", () => {
        if (!frameUrl) return;
        try {
          const doc = frame.contentDocument;
          if (doc?.readyState === "complete" && doc.title) {
            window.clearTimeout(frameTimeout);
            message.classList.remove("visible");
          } else {
            showMessage("酒馆页面没有完整载入，可重试连接。", true);
          }
        } catch {
          showMessage("酒馆页面无法读取，可重试连接。", true);
        }
      });
      frame.addEventListener("error", () => showMessage("酒馆页面加载失败，可重试连接。", true));
      launchTavern();
    })();
  </script>
</body>
</html>
